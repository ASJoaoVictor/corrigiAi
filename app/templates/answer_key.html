{% extends 'base.html' %}{% block content %}<h1>Cadastrar gabarito</h1><p>{{ exam.name }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% for n in range(1,31) %}<fieldset class="card"><legend>Questão {{ '%02d'|format(n) }}</legend><div class="choices">{% for letter in 'ABCDE' %}<label><input type="radio" name="q{{ n }}" value="{{ letter }}" {% if answers.get(n|string)==letter %}checked{% endif %} required><span>{{ letter }}</span></label>{% endfor %}</div></fieldset>{% endfor %}<div class="sticky"><button>Salvar gabarito</button></div></form>{% endblock %}
