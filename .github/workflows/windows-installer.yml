name: Instalador Windows

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edição do instalador
        type: choice
        required: true
        default: postgres
        options:
          - postgres
          - sqlite-test

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Gerar corrigiAi-Setup.msi
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
      BUILD_EDITION: ${{ inputs.edition }}

    steps:
      - name: Obter código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64

      - name: Instalar WiX 4.0.6
        run: |
          $Tools = Join-Path $env:RUNNER_TEMP 'wix-tools'
          dotnet tool install wix --version 4.0.6 --tool-path $Tools
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar WiX.' }
          $Tools | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Testar e gerar executável e MSI
        run: |
          $Python = Join-Path $env:pythonLocation 'python.exe'
          ./scripts/build_windows.ps1 -PythonExecutable $Python -Edition $env:BUILD_EDITION

      - name: Registrar checksum e dependências
        run: |
          $InstallerName = if ($env:BUILD_EDITION -eq 'sqlite-test') { 'corrigiAi-Testes-Setup.msi' } else { 'corrigiAi-Setup.msi' }
          $Installer = Join-Path 'dist' $InstallerName
          if (!(Test-Path $Installer)) { throw 'O instalador não foi gerado.' }
          $Hash = (Get-FileHash $Installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $InstallerName" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          & ./.venv-windows-build/Scripts/python.exe -m pip freeze | Set-Content dist/build-dependencies.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao registrar dependências.' }
          "Instalador gerado. Baixe o artefato da edição $env:BUILD_EDITION abaixo e extraia o ZIP." >> $env:GITHUB_STEP_SUMMARY

      - name: Disponibilizar instalador para download
        uses: actions/upload-artifact@v6
        with:
          name: corrigiAi-Windows-MSI${{ inputs.edition == 'sqlite-test' && '-Testes' || '' }}
          path: |
            dist/*Setup.msi
            dist/SHA256SUMS.txt
            dist/build-dependencies.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
